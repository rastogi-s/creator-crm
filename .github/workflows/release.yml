# Runs automatically after every merge to main (see auto-release.yml), or by hand:  git tag v1.1.0 && git push origin v1.1.0
# Builds and tests the app, makes installers for Windows / macOS / Linux, records the walkthrough videos, pushes a
# Docker image to ghcr.io, and creates a GitHub Release with everything attached. Installed apps see the new
# release within a few hours and offer "Update now". Tags with a suffix (v1.1.0-beta.1) become pre-releases, which
# installed apps ignore: use them to try a build yourself first.
name: Release

on:
  push:
    tags: ["v*"]
  # Called by auto-release.yml after every merge to main, with the tag it just created.
  workflow_call:
    inputs:
      tag:
        description: Version tag to build and publish, e.g. v1.2.3
        required: true
        type: string

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set version from tag
        run: bash ./mvnw -B -q versions:set -DnewVersion="${TAG#v}" -DgenerateBackupPoms=false
      - name: Build and test
        run: bash ./mvnw -B verify
      - uses: actions/upload-artifact@v7
        with:
          name: jar
          path: target/creator-manager-*.jar

  installers:
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            type: msi
            suffix: windows-x64
          - os: macos-latest
            type: dmg
            suffix: macos-apple-silicon
          - os: macos-15-intel
            type: dmg
            suffix: macos-intel
          - os: ubuntu-latest
            type: deb
            suffix: linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v8
        with:
          name: jar
          path: target
      - name: Install WiX Toolset 3 (Windows installers)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build installer
        shell: bash
        run: bash packaging/package.sh ${{ matrix.type }} "${TAG#v}"
      - name: Name it for the release page
        shell: bash
        run: |
          mkdir -p dist
          for f in target/installer/*.${{ matrix.type }}; do
            cp "$f" "dist/Creator-CRM-${TAG#v}-${{ matrix.suffix }}.${{ matrix.type }}"
          done
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.suffix }}
          path: dist/*

  docker:
    needs: jar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          name: jar
          path: target
      - run: cp target/creator-manager-*.jar packaging/creator-crm.jar
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/creator-crm
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"   # don't attach a build-record artifact to the run
        with:
          context: packaging
          file: packaging/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  walkthroughs:
    # Records the feature videos shown in the app's What's New and Help pages, against a demo-mode copy of this
    # exact build. See walkthroughs/README.md.
    needs: jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v8
        with:
          name: jar
          path: target
      - name: Install ffmpeg and Chromium
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          cd walkthroughs && npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Start the app in demo mode
        run: |
          mkdir -p walkthroughs/videos
          CRM_DATA_DIR="$RUNNER_TEMP/demo" CRM_DEMO_VIDEOS="$PWD/walkthroughs/videos" \
            nohup java -jar target/creator-manager-*.jar --spring.profiles.active=demo > "$RUNNER_TEMP/demo.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:8080/api/setup/status && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/demo.log"; exit 1
      - name: Record
        working-directory: walkthroughs
        run: node record.mjs
      - name: Check every video this version promises was recorded
        run: |
          V="${TAG#v}"; V="${V%%-*}"
          for f in $(jq -r --arg v "$V" '.[] | select(.version == $v) | .features[].video // empty' src/main/resources/whats-new.json); do
            test -s "walkthroughs/videos/$f" || { echo "::error::Missing walkthrough video $f (add a scenario to walkthroughs/record.mjs)"; exit 1; }
          done
      - if: failure()
        run: cat "$RUNNER_TEMP/demo.log" || true
      - uses: actions/upload-artifact@v7
        with:
          name: walkthroughs
          path: walkthroughs/videos/*.webm

  release:
    needs: [jar, installers, docker, walkthroughs]
    if: ${{ !cancelled() && needs.jar.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          # Only our files. The Docker build action also uploads a ".dockerbuild" record that can't be extracted.
          pattern: "{jar,installer-*,walkthroughs}"
      - name: Release notes from whats-new.json
        id: notes
        run: |
          V="${TAG#v}"; V="${V%%-*}"
          TITLE=$(jq -r --arg v "$V" '.[] | select(.version == $v) | .title // empty' src/main/resources/whats-new.json)
          echo "name=Creator CRM ${TAG#v}${TITLE:+: $TITLE}" >> "$GITHUB_OUTPUT"
          jq -r --arg v "$V" '.[] | select(.version == $v) | .features[] | "**" + .title + ".** " + .body + "\n"' \
            src/main/resources/whats-new.json > release-notes.md
          cat release-notes.md
      - name: Collect files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.webm' \) -exec cp {} release/ \;
          cp artifacts/jar/creator-manager-*.jar "release/creator-crm-${TAG#v}.jar"
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: release/*
          name: ${{ steps.notes.outputs.name }}
          body_path: release-notes.md
          generate_release_notes: true
          # v1.2.0-beta.1 and similar: for testing; installed apps only offer full releases.
          prerelease: ${{ contains(env.TAG, '-') }}
