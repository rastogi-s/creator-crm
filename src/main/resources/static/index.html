<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1c1a" media="(prefers-color-scheme: dark)">
  <title>Creator CRM</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Creator CRM">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/links.css">
  <link rel="stylesheet" href="/summary.css">
  <!-- Laptop and desktop only: a sidebar and more room. Phones never load these rules. -->
  <link rel="stylesheet" href="/desktop.css" media="(min-width: 1024px)">
</head>
<body>
<header class="topbar">
  <div class="brand"><img class="brand-mark" src="/favicon.png" alt="" width="26" height="26"><span>Creator CRM</span></div>
  <nav class="tabs" aria-label="Sections">
    <button class="tab" data-tab="today"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg><span>Today</span></button>
    <button class="tab" data-tab="drafts"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h17v11a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1zm0 0 8.5 6.5 8.5-6.5"/></svg><span>Drafts</span> <span id="drafts-count" class="badge accent hidden"></span></button>
    <button class="tab" data-tab="pipeline"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h11M4 18h7"/></svg><span>Deals</span></button>
    <button class="tab" data-tab="money"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7h17v10h-17zM12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg><span>Money</span></button>
    <button class="tab" data-tab="more"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg><span>More</span></button>
    <!-- Laptop only (desktop.css): the pages under More get their own place in the sidebar. -->
    <button class="tab desk" data-tab="summary"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg><span>Day summary</span></button>
    <button class="tab desk" data-tab="contacts"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 6.5M18 14a6 6 0 0 1 3.5 6"/></svg><span>Brand contacts</span></button>
    <button class="tab desk" data-tab="links"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span>My links</span></button>
    <button class="tab desk" data-tab="settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM19.4 13.5l1.6 1.2-2 3.4-1.9-.7a7 7 0 0 1-1.7 1l-.3 2h-4l-.3-2a7 7 0 0 1-1.7-1l-1.9.7-2-3.4 1.6-1.2a7 7 0 0 1 0-3L3.4 9.3l2-3.4 1.9.7a7 7 0 0 1 1.7-1l.3-2h4l.3 2a7 7 0 0 1 1.7 1l1.9-.7 2 3.4-1.6 1.2a7 7 0 0 1 0 3z"/></svg><span>Settings</span></button>
    <button class="tab desk" data-tab="help"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/></svg><span>Help</span></button>
    <button class="tab desk" data-tab="whatsnew"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg><span>What's new</span></button>
  </nav>
  <div class="global-search" role="search">
    <input id="global-search" type="search" placeholder="Search… ( / )" aria-label="Search brands, contacts, emails and invoices"
           autocomplete="off" maxlength="100" aria-controls="global-results" aria-expanded="false">
    <div id="global-results" class="search-results hidden"></div>
  </div>
  <button id="sync-btn" class="small" title="Fetch new emails and DMs now">Check for new messages</button>
  <div id="update-banner" class="update-banner hidden" role="status" aria-live="polite"></div>
  <div id="credit-banner" class="update-banner hidden" role="alert"></div>
  <div id="channel-banner" class="update-banner error hidden" role="alert"></div>
  <div id="sync-status-row" class="status-row hidden"><span id="sync-status" class="sync-status" role="status" aria-live="polite"></span></div>
</header>

<main>
  <section id="view-today" class="view"></section>
  <section id="view-pipeline" class="view hidden"></section>
  <section id="view-money" class="view hidden"></section>
  <section id="view-outreach" class="view hidden"></section>
  <section id="view-links" class="view hidden"></section>
  <section id="view-contacts" class="view hidden"></section>
  <section id="view-drafts" class="view hidden"></section>
  <section id="view-summary" class="view hidden"></section>
  <section id="view-settings" class="view hidden"></section>
  <section id="view-help" class="view hidden"></section>
  <section id="view-whatsnew" class="view hidden"></section>
  <section id="view-more" class="view hidden"></section>
  <section id="view-setup" class="view hidden"></section>
  <section id="view-directory" class="view hidden"></section>
</main>

<div id="drawer-backdrop" class="drawer-backdrop hidden"></div>
<aside id="drawer" class="drawer hidden" aria-label="Deal details"></aside>
<div id="toast" class="toast hidden" role="status"></div>

<!-- The dashboard, split by page. Order matters: core first, main last (see js/core.js). -->
<script src="/js/core.js"></script>
<script src="/js/today.js"></script>
<script src="/js/pipeline.js"></script>
<script src="/js/money.js"></script>
<script src="/js/deal.js"></script>
<script src="/js/outreach.js"></script>
<script src="/js/links.js"></script>
<script src="/js/contacts.js"></script>
<script src="/js/drafts.js"></script>
<script src="/js/summary.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/updates.js"></script>
<script src="/js/setup-guide.js"></script>
<script src="/js/directory.js"></script>
<script src="/js/more.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
