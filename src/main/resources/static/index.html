<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creator CRM</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Creator CRM">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/links.css">
  <link rel="stylesheet" href="/summary.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Creator CRM</div>
  <nav class="tabs" aria-label="Sections">
    <button class="tab" data-tab="today"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg><span>Today</span></button>
    <button class="tab" data-tab="drafts"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h17v11a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1zm0 0 8.5 6.5 8.5-6.5"/></svg><span>Drafts</span> <span id="drafts-count" class="badge accent hidden"></span></button>
    <button class="tab" data-tab="pipeline"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h11M4 18h7"/></svg><span>Deals</span></button>
    <button class="tab" data-tab="money"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7h17v10h-17zM12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg><span>Money</span></button>
    <button class="tab" data-tab="more"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg><span>More</span></button>
  </nav>
  <div class="global-search" role="search">
    <input id="global-search" type="search" placeholder="Search… ( / )" aria-label="Search brands, contacts, emails and invoices"
           autocomplete="off" maxlength="100" aria-controls="global-results" aria-expanded="false">
    <div id="global-results" class="search-results hidden"></div>
  </div>
  <button id="sync-btn" class="small" title="Fetch new emails and DMs now">Check for new messages</button>
  <div id="update-banner" class="update-banner hidden" role="status" aria-live="polite"></div>
  <div id="credit-banner" class="update-banner hidden" role="alert"></div>
  <div id="channel-banner" class="update-banner error hidden" role="alert"></div>
  <div id="sync-status-row" class="status-row hidden"><span id="sync-status" class="sync-status" role="status" aria-live="polite"></span></div>
</header>

<main>
  <section id="view-today" class="view"></section>
  <section id="view-pipeline" class="view hidden"></section>
  <section id="view-money" class="view hidden"></section>
  <section id="view-outreach" class="view hidden"></section>
  <section id="view-links" class="view hidden"></section>
  <section id="view-drafts" class="view hidden"></section>
  <section id="view-summary" class="view hidden"></section>
  <section id="view-settings" class="view hidden"></section>
  <section id="view-help" class="view hidden"></section>
  <section id="view-whatsnew" class="view hidden"></section>
  <section id="view-more" class="view hidden"></section>
  <section id="view-setup" class="view hidden"></section>
</main>

<div id="drawer-backdrop" class="drawer-backdrop hidden"></div>
<aside id="drawer" class="drawer hidden" aria-label="Deal details"></aside>
<div id="toast" class="toast hidden" role="status"></div>

<script src="/app.js"></script>
</body>
</html>
